# Two environments, two histories (decision Q10).
#
#   alembic -n shared revision --autogenerate -m "add organizations"
#   alembic -n tenant revision --autogenerate -m "add patients"
#
# Upgrades go through the flask-tenants CLI rather than `alembic upgrade`,
# because the tenant environment needs to be told which schema to work on:
#
#   flask-tenants upgrade --shared
#   flask-tenants upgrade --all

[shared]
script_location = migrations/shared
version_path_separator = os
sqlalchemy.url = driver://user:pass@localhost/dbname

[tenant]
script_location = migrations/tenant
version_path_separator = os
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
